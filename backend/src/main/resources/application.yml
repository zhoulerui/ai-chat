server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/plain,text/html,text/css,application/javascript,application/json

spring:
  application:
    name: oracle-games   # 神谕百科 Oracle of Games
  ai:
    # DeepSeek 原生供应商(spring-ai-starter-model-deepseek,1.1.x)
    deepseek:
      api-key: ${AI_API_KEY:sk-b7405a645ad84df1b93bdefc433aa66d}
      chat:
        options:
          # 默认快速档;深度思考档(deepseek-v4-flash)由前端 modelId=deep 切换
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.7
          max-tokens: 2048
  # 生产数据库(MySQL)。本地验证用 application-local.yml(H2)
  # 首次部署需在 MySQL 建库(或手动执行,账号需建库权限):
  #   CREATE DATABASE IF NOT EXISTS ai_chat CHARACTER SET utf8mb4;
  # 注意:characterEncoding 只接受 Java 字符集名(utf8/UTF-8),Connector/J 9.x
  # 会与服务器协商为 utf8mb4(emoji 正常);写 utf8mb4 会报
  # "Unsupported character encoding 'utf8mb4'"(utf8mb4 不是 Java 字符集名)。
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_chat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always          # 启动时执行 schema.sql(建表,幂等)
  servlet:
    multipart:
      max-file-size: 20MB   # 单个上传文件上限(PDF/文档可能较大)
      max-request-size: 50MB

# API 文档(springdoc-openapi / Swagger UI)
# 入口:http://host:port/swagger-ui.html 与 /v3/api-docs
# 生产环境想关闭,把 enabled 改成 false 即可(需重新打包)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

# 本地嵌入模型(ONNX,纯 Java)
ai-chat:
  onnx:
    model-path: ${AI_MODEL_PATH:/opt/ai-chat/models/bge-small-zh-v1.5/model.onnx}
    tokenizer-path: ${AI_TOKENIZER_PATH:/opt/ai-chat/models/bge-small-zh-v1.5/tokenizer.json}
  # 模型档位:前端 modelId → DeepSeek 模型名(可扩展更多档位)
  # 注意:deepseek-v4-flash / deepseek-v4-pro 思考模式默认开启(官网默认),
  # 无需额外参数即返回 reasoning_content;deepseek-chat 为非思考档。
  models:
    fast: deepseek-chat
    deep: deepseek-v4-flash
    pro: deepseek-v4-pro

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: info
    com.example.aichat: debug          # 业务日志 + MyBatis SQL 日志(debug 时打印)
  # 强制 UTF-8 输出,避免 Windows(JVM 默认 GBK)下 IDEA 控制台中文乱码
  charset:
    console: UTF-8
    file: UTF-8
  # 日志落盘:默认 /opt/ai-chat/logs/ai-chat.log(Docker 部署时由 compose volume 挂到宿主机,
  # 宿主 tail -f 即可查看);本地开发用 application-local.yml 覆盖为相对路径 logs/。
  # 可用环境变量 AI_LOG_PATH 覆盖。
  file:
    name: ${AI_LOG_PATH:/opt/ai-chat/logs/ai-chat.log}
