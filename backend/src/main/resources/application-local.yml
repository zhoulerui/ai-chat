# 本地验证用:H2 内存库 + 本地模型路径
# 启动:java -jar ai-chat.jar --spring.profiles.active=local
# 走 dynamic-datasource 单源(h2),表直接建在当前库(见 schema.sql)
spring:
  datasource:
    dynamic:
      primary: h2
      strict: false
      datasource:
        h2:
          url: jdbc:h2:mem:ai_chat;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
          username: sa
          password: ""
          driver-class-name: org.h2.Driver

ai-chat:
  onnx:
    model-path: ${AI_MODEL_PATH:D:\self-project\LLM-demo\.tmp\bge\model.onnx}
    tokenizer-path: ${AI_TOKENIZER_PATH:D:\self-project\LLM-demo\.tmp\bge\tokenizer.json}

# 本地日志写到工作目录 logs/(相对路径),不写生产路径
logging:
  file:
    name: logs/ai-chat.log
  level:
    org.springframework.ai: DEBUG